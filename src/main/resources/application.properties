spring.application.name=board-svc

# SOT: 운영·k3s 값은 infra 폴더(Helm/매니페스트)가 단일 진실 소스. 이 파일은 로컬 편의·바인딩 키 정의용.

# HS256 검증용 공유 시크릿(발급 서비스와 동일). k3s: JWT_SECRET
jwt.secret=${JWT_SECRET:01234567890123456789012345678901}

# k3s·로컬 실행: SPRING_DATASOURCE_* 필수 (기본값 없음).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
